name: Visual Regression

# Baseline: the parent commit (push) or base branch tip (PR), so the comparison
# always answers "did THIS change break the UI?".
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for intended UI change
        id: ui_change
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ui-change') }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          skip=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            skip="$PR_HAS_LABEL"
          else
            labeled="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[].labels[].name] | index("ui-change") != null')"
            if [ "$labeled" = "true" ]; then
              skip=true
            fi
            case "$HEAD_COMMIT_MESSAGE" in
              *"[ui-change]"*) skip=true ;;
            esac
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Determine baseline SHA
        id: baseline
        if: steps.ui_change.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sha="$PR_BASE_SHA"
          else
            sha="$PUSH_BEFORE_SHA"
          fi
          # A force-push leaves `before` unreachable and a new branch sends all zeros.
          if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            sha="$(git rev-parse --verify --quiet HEAD^ || true)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build baseline image
        if: steps.ui_change.outputs.skip != 'true'
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          if [ -z "$BASELINE_SHA" ]; then
            echo "No parent commit — using current commit as baseline (no regression possible)"
            docker build -t easy-web-gpg:baseline .
          else
            git checkout "$BASELINE_SHA"
            docker build -t easy-web-gpg:baseline .
            git checkout -
          fi

      - name: Build current image
        run: docker build -t easy-web-gpg:current .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: ./tests
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 5
        working-directory: ./tests
        run: npx playwright install --with-deps chromium

      - name: Start containers
        env:
          SKIP_COMPARISON: ${{ steps.ui_change.outputs.skip }}
        run: |
          docker run -d --name easy-web-gpg-current -p 8080:8080 \
            -e MASTER_PASSWORD=test-password \
            easy-web-gpg:current
          if [ "$SKIP_COMPARISON" != "true" ]; then
            docker run -d --name easy-web-gpg-baseline -p 8081:8080 \
              -e MASTER_PASSWORD=test-password \
              easy-web-gpg:baseline
          fi

      - name: Wait for containers
        env:
          SKIP_COMPARISON: ${{ steps.ui_change.outputs.skip }}
        run: |
          wait_ready() {
            local name="$1" port="$2"
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/" > /dev/null 2>&1; then
                echo "$name ready on port $port"
                return 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                break
              fi
              echo "Waiting for $name... ($i/30)"
              sleep 1
            done
            echo "::error::$name did not become ready on port $port"
            docker logs "$name"
            return 1
          }
          wait_ready easy-web-gpg-current 8080
          if [ "$SKIP_COMPARISON" != "true" ]; then
            wait_ready easy-web-gpg-baseline 8081
          fi

      - name: Run functional tests
        working-directory: ./tests
        env:
          BASE_URL: http://localhost:8080
          MASTER_PASSWORD: test-password
        run: npx playwright test e2e/visual.spec.ts --grep-invert @visual

      - name: Run visual comparison
        if: steps.ui_change.outputs.skip != 'true'
        working-directory: ./tests
        env:
          BASELINE_URL: http://localhost:8081
          BASE_URL: http://localhost:8080
          MASTER_PASSWORD: test-password
        run: npx playwright test e2e/visual.spec.ts --grep @visual

      - name: Visual comparison skipped
        if: steps.ui_change.outputs.skip == 'true'
        run: 'echo "::notice::Visual comparison skipped: [ui-change]"'

      - name: Stop containers
        if: always()
        run: docker rm -f easy-web-gpg-baseline easy-web-gpg-current 2>/dev/null || true

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-diffs
          path: tests/test-results/
          retention-days: 7
