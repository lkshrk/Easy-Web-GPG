name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: github.event_name != 'pull_request'
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: go-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: ./tests
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 5
        working-directory: ./tests
        run: npx playwright install --with-deps chromium

      - name: Build Docker image
        run: docker build -t easy-web-gpg:test .

      - name: Start application container
        run: |
          docker run -d --name easy-web-gpg-test \
            -p 8080:8080 \
            -e MASTER_PASSWORD=test-password \
            easy-web-gpg:test

      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Application is ready"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' easy-web-gpg-test)" != "true" ]; then
              break
            fi
            echo "Waiting for application... ($i/30)"
            sleep 1
          done
          echo "::error::easy-web-gpg-test did not become ready on port 8080"
          docker logs easy-web-gpg-test
          exit 1

      - name: Run Playwright tests
        working-directory: ./tests
        env:
          BASE_URL: http://localhost:8080
          MASTER_PASSWORD: test-password
        run: npx playwright test e2e/app.spec.ts --reporter=list

      - name: Stop application
        if: always()
        run: docker stop easy-web-gpg-test || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-screenshots
          path: tests/test-results/
          retention-days: 7
